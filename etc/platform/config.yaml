# harns-platform configuration file.
#
# Place this file at /etc/platform/config.yaml (the default path loaded on startup),
# or point to it explicitly with:  ./platform -c /etc/platform/config.yaml
#
# Command-line flags always override values defined here.

# HTTP/HTTPS port exposed by the platform service.
port: "32300"

# The duration the server gracefully waits for existing connections to finish
# before shutting down (e.g. 15s, 1m).
graceful-timeout: 15s

# TLS certificates. Leave both empty to serve plain HTTP.
cert-file: ""
key-file: ""

# Redis connection.
redis:
  addrs:
    - 127.0.0.1:6379
  username: ""
  password: ""
  db: 0

# MySQL connection.
mysql:
  host: 127.0.0.1
  port: 3306
  username: root
  password: ""
  database: harns
  charset: utf8mb4

# MinIO object storage connection.
minio:
  endpoint: 127.0.0.1:9000
  access-key: ""
  secret-key: ""
  use-ssl: false
  bucket: harns

# Authentication (JWT + Redis session, RSA password decryption).
security:
  # HTTP header carrying the JWT.
  token-header: Authorization
  # HMAC signing secret, MUST be at least 32 bytes. Changing it invalidates all tokens.
  token-secret: "please-change-me-32-bytes-or-more"
  # Session lifetime in minutes (user expireTimes overrides it; negative = never expire).
  expire-minutes: 60
  # Refresh session TTL when remaining time is below this many minutes.
  refresh-minutes: 10
  # Lock the account after this many consecutive login failures.
  max-login-failed: 5
  # Lock duration in minutes; the account auto-unlocks after it.
  lock-minutes: 60
  # Enable RSA password decryption (key pair stored in MinIO).
  rsa-enabled: true
  # Captcha expiry in seconds.
  captcha-ttl-seconds: 300

# Audit log (write operations only; request/response bodies truncated and masked).
audit:
  enabled: true
  # Max stored bytes for request/response bodies.
  max-body-bytes: 16384
  # Async queue size; logs are dropped when full.
  queue-size: 1024

# Logging configuration.
logging:
  # Log format: "text" or "json".
  format: json
  # Verbosity threshold for V(level) logs.
  verbosity: 2
  # Destination: "stderr", "stdout" or a file path.
  # Leave empty to write to <binary dir>/../log/<service>.log.
  output: "../log/harns-platform.log"
  # Log rotation (only applies when logging to a file).
  max-size: 100     # maximum size in MB of a log file before rotation
  max-backups: 7    # number of old log files to retain (0 = keep all)
  max-age: 7        # days to retain old log files (0 = keep forever)
  compress: true    # gzip rotated files
  local-time: true  # use local time in rotated file names

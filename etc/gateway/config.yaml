# harns-gateway configuration file.
#
# Place this file at /etc/gateway/config.yaml (the default path loaded on startup),
# or point to it explicitly with:  ./harns-gateway -c /etc/gateway/config.yaml
#
# Command-line flags always override values defined here.

# HTTP/HTTPS port exposed by the gateway.
port: "32200"

# The duration the server gracefully waits for existing connections to finish
# before shutting down (e.g. 15s, 1m).
graceful-timeout: 15s

# Maximum request body size in bytes (10 MiB).
max-body-bytes: 10485760

# MQTT broker urls. Scheme must be one of "tcp", "ssl" or "ws".
mqtt-broker-urls:
  - tcp://127.0.0.1:1883

mqtt-username: ""
mqtt-password: ""

# TLS certificates. Leave both empty to serve plain HTTP.
cert-file: ""
key-file: ""

# CORS configuration.
cors:
  allowed-origins:
    - "*"
  allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowed-headers: [Authorization, Content-Type, X-Trace-Id]
  expose-headers: [X-Trace-Id]
  allow-credentials: false
  max-age-seconds: 3600

# Logging configuration.
logging:
  # Log format: "text" or "json".
  format: text
  # Verbosity threshold for V(level) logs.
  verbosity: 2
  # Destination: "stderr", "stdout" or a file path.
  # Leave empty to write to <binary dir>/../log/<service>.log.
  output: "../log/harns-gateway.log"
  # Log rotation (only applies when logging to a file).
  max-size: 100     # maximum size in MB of a log file before rotation
  max-backups: 7    # number of old log files to retain (0 = keep all)
  max-age: 7        # days to retain old log files (0 = keep forever)
  compress: true    # gzip rotated files
  local-time: true  # use local time in rotated file names

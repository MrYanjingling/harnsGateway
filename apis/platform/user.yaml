openapi: 3.0.1
info:
  description: "API for managing users (with role and org bindings)."
  version: "0.0.2"
  title: "Platform User API"
servers:
  - url: "/api/v1"
tags:
  - name: User
    description: User management.
paths:
  /iot/users:
    get:
      tags: [User]
      summary: List users (paged).
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 1 }
                      page: { type: integer, example: 1 }
                      pageSize: { type: integer, example: 10 }
                      list:
                        type: array
                        items: { $ref: '#/components/schemas/UserVo' }
    post:
      tags: [User]
      summary: Create a user with optional roles and orgs.
      description: Validates that all roleIds/orgIds exist; writes user and both association tables in one transaction.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserReq' }
      responses:
        '200':
          description: Created user
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResult' }
        '400':
          description: Business error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResult' }
  /iot/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [User]
      summary: Get a user by id.
      operationId: getUserById
      responses:
        '200':
          description: The user
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResult' }
        '400':
          description: Business error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResult' }
    put:
      tags: [User]
      summary: Update a user.
      operationId: updateUserById
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserReq' }
      responses:
        '200':
          description: Updated user
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResult' }
        '400':
          description: Business error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResult' }
    delete:
      tags: [User]
      summary: Delete a user (physical). Role/org bindings are removed in the same transaction.
      operationId: deleteUserById
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResult' }
        '400':
          description: Business error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResult' }

  /iot/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [User]
      summary: Reset the password to "<userName>@123".
      operationId: resetUserPassword
      responses:
        '200':
          description: Updated user
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResult' }
        '400':
          description: Business error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResult' }

components:
  schemas:
    CreateUserReq:
      type: object
      required: [userName, userNo, nickName]
      properties:
        userName: { type: string, maxLength: 64 }
        password:
          type: string
          minLength: 6
          maxLength: 64
          description: Optional. Defaults to "<userName>@123".
        userNo: { type: string, maxLength: 64 }
        nickName: { type: string, maxLength: 64 }
        birthDate: { type: string, format: date, example: "1990-01-01" }
        gender: { type: string, enum: [male, female] }
        mail: { type: string, format: email }
        phone: { type: string, maxLength: 32 }
        note: { type: string, maxLength: 255 }
        authKey: { type: string, maxLength: 128 }
        authMode: { type: string, enum: [local, ldap, radius], default: local }
        expireTimes: { type: integer, minimum: 0 }
        status: { type: string, enum: [enabled, disabled], default: enabled }
        roleIds:
          type: array
          items: { type: string }
          description: Role IDs to bind (validated).
        orgIds:
          type: array
          items: { type: string }
          description: Organization IDs to bind (validated).
    UpdateUserReq:
      type: object
      properties:
        userName: { type: string, maxLength: 64 }
        password: { type: string, minLength: 6, maxLength: 64 }
        userNo: { type: string, maxLength: 64 }
        nickName: { type: string, maxLength: 64 }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [male, female] }
        mail: { type: string, format: email }
        phone: { type: string, maxLength: 32 }
        note: { type: string, maxLength: 255 }
        authKey: { type: string, maxLength: 128 }
        authMode: { type: string, enum: [local, ldap, radius] }
        expireTimes: { type: integer, minimum: 0 }
        status: { type: string, enum: [enabled, disabled] }
    UserVo:
      type: object
      properties:
        id: { type: string }
        version: { type: integer, format: int64 }
        userName: { type: string }
        userNo: { type: string }
        nickName: { type: string }
        birthDate: { type: string, example: "1990-01-01" }
        gender: { type: string, enum: [male, female] }
        mail: { type: string }
        phone: { type: string }
        note: { type: string }
        authMode: { type: string, enum: [local, ldap, radius] }
        lastLoginTime: { type: string, format: date-time, nullable: true }
        loginFailureTimes: { type: integer }
        expireTimes: { type: integer }
        status: { type: string, enum: [enabled, disabled] }
        createdUser: { type: string }
        updatedUser: { type: string }
        createdTime: { type: string, format: date-time }
        updatedTime: { type: string, format: date-time }
        roleIds:
          type: array
          items: { type: string }
        orgIds:
          type: array
          items: { type: string }
        roles:
          type: array
          description: Bound roles (full objects).
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              code: { type: string }
              status: { type: string, enum: [enabled, disabled] }
        orgs:
          type: array
          description: Bound organizations (full objects).
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              code: { type: string }
              parentId: { type: string }
              status: { type: string, enum: [enabled, disabled] }
    UserResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/UserVo' }
    ErrorResult:
      type: object
      properties:
        code: { type: integer, example: 10019 }
        message: { type: string, example: "User name [admin] already exists." }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: integer }
              message: { type: string }
